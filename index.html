<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKU Detection Demo - ActivAsia</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input { margin: 15px 0; }
    button { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    #output { text-align: left; background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 5px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 15px; }
    img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Retail SKU Detector (POC Demo)</h2>
    <p>Mag-upload ng larawan ng Knorr products para ma-detect:</p>
    
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" />
    <br/>
    <img id="preview" alt="Preview Image" />
    <br/>
    <button onclick="detectSKU()">Detect SKUs</button>

    <h3>Detection Output (JSON):</h3>
    <pre id="output">Mag-upload ng picture para makita ang JSON response...</pre>
  </div>

  <script>
    const API_KEY = "6BhQ0JKRGhCFfOtFmsUd";
    const MODEL_ID = "ai-labeling-zrrbb-2-rfdetr-seg-small-t1";
    const VERSION = "1";

    function previewImage(event) {
      const img = document.getElementById('preview');
      img.src = URL.createObjectURL(event.target.files[0]);
      img.style.display = 'block';
    }

    async function detectSKU() {
      const input = document.getElementById('imageInput');
      const output = document.getElementById('output');

      if (!input.files[0]) {
        alert("Pumili muna ng litrato!");
        return;
      }

      output.innerText = "Processing image via Roboflow API...";

      const reader = new FileReader();
      reader.readAsDataURL(input.files[0]);
      reader.onload = async function () {
        const base64Image = reader.result.split(',')[1];

        try {
          const response = await fetch(`https://detect.roboflow.com/${MODEL_ID}/${VERSION}?api_key=${API_KEY}&confidence=15`, {
            method: "POST",
            headers: { 
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: base64Image
          });

          const result = await response.json();
          output.innerText = JSON.stringify(result, null, 2);
        } catch (error) {
          output.innerText = "Error connecting to API: " + error.message;
        }
      };
    }
  </script>

</body>
</html>
